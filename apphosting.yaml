# Firebase App Hosting – https://firebase.google.com/docs/app-hosting
runConfig:
  runtime: nodejs22
  concurrency: 80
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10

env:
  - variable: ADMIN_PIN
    secret: ADMIN_PIN
  - variable: FIREBASE_STORAGE_BUCKET
    value: gg-connect-db18a-parkaden
    availability:
      - RUNTIME
      - BUILD
